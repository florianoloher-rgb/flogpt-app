<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FloGPT</title>
    <style>
        body { background:#0a0a0a; color:#00ff41; font-family:-apple-system, BlinkMacSystemFont, sans-serif;
               display:flex; justify-content:center; align-items:center; height:100vh; margin:0;
               flex-direction:column; gap:20px; text-align:center; padding:20px; }
        .spinner { width:40px; height:40px; border:3px solid rgba(0,255,65,.2);
                   border-top-color:#00ff41; border-radius:50%;
                   animation:spin 1s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .logo { font-size:2rem; font-weight:900;
                background: linear-gradient(45deg, #00ff41, #FFD700);
                -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hint { color:#888; font-size:.85rem; max-width:300px; line-height:1.5; }
        .error { color:#ff2d55; font-size:.9rem; max-width:320px; line-height:1.5; }
        .debug { color:#444; font-size:.7rem; font-family:monospace; max-width:340px; line-height:1.4; margin-top:10px; }
    </style>
</head>
<body>
    <div class="spinner" id="spinner"></div>
    <div class="logo">FloGPT</div>
    <div class="hint" id="status">Starte...</div>
    <div class="debug" id="debug"></div>

    <script>
    const CLOUDFLARE_URL = 'https://flogpt.floriano-loher.workers.dev/';

    function setDebug(msg) {
        const d = document.getElementById('debug');
        if (d) d.textContent = msg;
        console.log('[Bootstrap]', msg);
    }

    async function boot() {
        const statusEl = document.getElementById('status');
        const spinnerEl = document.getElementById('spinner');

        statusEl.textContent = 'Prüfe Verbindung...';

        // 1. Schnelltest: navigator.onLine (aus Android-System)
        const navOnline = navigator.onLine;
        setDebug('navigator.onLine = ' + navOnline);

        if (navOnline) {
            // navigator sagt online → direkt zu Cloudflare
            statusEl.textContent = 'Online. Lade FloGPT...';
            setDebug('Gehe zu Cloudflare (navigator = online)');
            await new Promise(r => setTimeout(r, 200));
            window.location.replace(CLOUDFLARE_URL);
            return;
        }

        // 2. navigator sagt offline → Sicherheits-Check per fetch
        let fetchOk = false;
        try {
            const ctrl = new AbortController();
            setTimeout(() => ctrl.abort(), 2500);
            await fetch(CLOUDFLARE_URL + '?ping=' + Date.now(), {
                method: 'GET',
                signal: ctrl.signal,
                cache: 'no-store',
                mode: 'no-cors'
            });
            fetchOk = true;
        } catch (e) {
            fetchOk = false;
        }

        if (fetchOk) {
            statusEl.textContent = 'Online (via fetch). Lade FloGPT...';
            setDebug('Gehe zu Cloudflare (fetch = OK)');
            await new Promise(r => setTimeout(r, 200));
            window.location.replace(CLOUDFLARE_URL);
            return;
        }

        // 3. Wirklich offline → Preferences laden
        setDebug('Offline-Modus aktiv');
        statusEl.textContent = 'Offline erkannt. Lade gespeicherte Version...';

        try {
            const Preferences = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences;
            if (!Preferences) {
                throw new Error('Preferences-Plugin nicht verfügbar');
            }

            const { value } = await Preferences.get({ key: 'flogpt_offline_html' });

            if (!value) {
                spinnerEl.style.display = 'none';
                statusEl.className = 'error';
                statusEl.innerHTML =
                    '📴 <b>Keine Offline-Version installiert</b><br><br>' +
                    'Bitte gehe online, öffne die Einstellungen → FloGPT Offline → ' +
                    '„Neues Update installieren".';
                return;
            }

            statusEl.textContent = 'Starte Offline-Modus...';
            await new Promise(r => setTimeout(r, 300));

            document.open();
            document.write(value);
            document.close();

        } catch (e) {
            spinnerEl.style.display = 'none';
            statusEl.className = 'error';
            statusEl.innerHTML =
                '⚠️ <b>Fehler:</b> ' + (e.message || 'Unbekannt');
        }
    }

    boot();

    window.addEventListener('online', () => {
        setTimeout(() => window.location.reload(), 1000);
    });
    </script>
</body>
</html>
